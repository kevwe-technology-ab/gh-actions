name: Generic Cron Job

on:
  workflow_dispatch:
  schedule:
    - cron: '25 17 * * *' # Every day at 18:25 UTC

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run script
        run: echo "Scheduled job ran at $(date -u)"

      - name: List files
        run: |
          find .
