name: 'Build Golang Project'
description: 'Builds the Golang project'

inputs:
  repo-url:
    description: 'The Git repository URL'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Checkout Own Code and Actions
      uses: actions/checkout@v7

    - name: Checkout Golang code
      id: checkout-go-code
      shell: bash
      run: |
        git clone ${{ inputs.repo-url }} .

    - name: Build
      id: build-go-project
      run: go build -v .
